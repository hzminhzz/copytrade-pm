name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            extra: ""
          - name: market
            extra: "--extra market"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
      - name: Python 3.14
        run: uv python install 3.14
      - name: Frozen dependencies
        run: uv sync --frozen --group dev ${{ matrix.extra }}
      - name: Tests
        run: uv run --frozen --group dev ${{ matrix.extra }} python -m pytest -q tests
      - name: Lint
        run: uv run --frozen --group dev ${{ matrix.extra }} ruff check src tests
      - name: Format
        run: uv run --frozen --group dev ${{ matrix.extra }} ruff format --check src tests
      - name: Build
        run: uv build
