# Source/research changes are checked independently of the Guardian companion gate.
# Engineering checks never qualify source continuity, economics or trading.
name: research-engineering
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync pinned research environment
        run: uv sync --python 3.14 --frozen --all-extras --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops/control-center/package-lock.json
      - name: Build read-only operations frontend for HTTP contract tests
        working-directory: ops/control-center
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Tests
        run: uv run --python 3.14 --no-sync pytest -q
      - name: Static checks
        run: |
          uv run --python 3.14 --no-sync ruff check src tests scripts
          uv run --python 3.14 --no-sync ruff format --check src tests
      - name: Build and capability validation
        run: |
          uv build --no-sources
          uv run --python 3.14 --no-sync copytrade-pm capabilities validate
