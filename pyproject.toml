[project]
name = "copytrade-pm"
version = "0.1.0"
description = "Black-box wallet PM research and shadow-only prop-firm portfolio risk"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["copytrade-kernel", "cryptography>=46.0", "pydantic==2.14.3"]

[tool.uv.sources]
# Single financial-math authority: prop-production hosts the stdlib kernel wheel.
copytrade-kernel = { git = "https://github.com/hzminhzz/prop-production.git", subdirectory = "packages/copytrade-kernel", rev = "b1338984673b2c6225f1a13446bb6c596c67022d" }

[project.optional-dependencies]
market = ["polars>=2.0,<3", "pandas>=2.3"]
market-stream = ["ccxt==4.5.91"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-xdist==3.8.0", "ruff>=0.8"]

[project.scripts]
copytrade-pm = "copytrade_pm.pm_operations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copytrade_pm"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B006",
    "B011",
    "B012",
    "B015",
    "B018",
    "B021",
    "B026",
    "B028",
    "B029",
    "B032",
    "B033",
    "B034",
    "PGH003",
    "PGH004",
    "PGH005",
    "PLE",
    "RUF006",
    "RUF013",
    "RUF016",
    "RUF020",
    "RUF024",
    "RUF026",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
