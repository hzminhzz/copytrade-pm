[project]
name = "copytrade-pm"
version = "0.1.0"
description = "Black-box wallet PM research and shadow-only prop-firm portfolio risk"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
market = ["polars>=1.20", "pandas>=2.3"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
copytrade-pm-replay = "copytrade_pm.pm_fill_replay:main"
copytrade-pm-rank = "copytrade_pm.pm_manager:main"
copytrade-pm-handoff = "copytrade_pm.pm_handoff:main"
copytrade-pm-scope = "copytrade_pm.pm_propr_scope:main"
copytrade-pm-market-audit = "copytrade_pm.pm_market_audit:main"
copytrade-pm-research = "copytrade_pm.pm_research:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copytrade_pm"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
